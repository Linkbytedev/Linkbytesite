<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Linkbyte</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .error-content {
      max-width: 480px;
    }

    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text);
      opacity: 0.08;
      margin-bottom: -0.5rem;
      user-select: none;
    }

    .error-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      background: var(--accent-dim);
      border: 1px solid rgba(59, 130, 246, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
    }

    .error-icon svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.875rem;
    }

    .error-body {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2.25rem;
    }

    .error-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .quick-links {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .quick-links a {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: color 0.2s, border-color 0.2s;
    }

    .quick-links a:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="index.html" class="logo">Link<span>byte</span></a>
      <ul class="nav-links" role="list">
        <li><a href="about.html">About</a></li>
        <li><a href="apps.html">Apps</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="https://github.com/Linkbytedev" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <nav class="nav-drawer" aria-label="Mobile navigation">
    <a href="about.html">About</a>
    <a href="apps.html">Apps</a>
    <a href="contact.html">Contact</a>
    <a href="https://github.com/Linkbytedev" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <main class="error-page">
    <div class="error-content">
      <div class="error-code" aria-hidden="true">404</div>
      <div class="error-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-body">The page you are looking for has moved, been removed, or never existed. Let&apos;s get you back on track.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Return Home</a>
        <a href="apps.html" class="btn btn-ghost">Browse Apps</a>
      </div>
      <nav class="quick-links" aria-label="Quick links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="https://github.com/Linkbytedev" target="_blank" rel="noopener">GitHub</a>
        <a href="https://x.com/linkbyte_dev" target="_blank" rel="noopener">X</a>
      </nav>
    </div>
  </main>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const drawer = document.querySelector('.nav-drawer');
    toggle.addEventListener('click', () => {
      const open = drawer.classList.toggle('open');
      toggle.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open);
    });
  </script>
</body>
</html>
